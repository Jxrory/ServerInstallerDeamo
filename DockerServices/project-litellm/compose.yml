# ============================================
# LiteLLM - Production Docker Compose
# ============================================
# LiteLLM proxy server. PostgreSQL lives in
# compose/middleware.yml (shared across projects).
# Redis from middleware.yml is available on the
# ops-network if LiteLLM's caching / distributed
# router features are enabled.

# Shared service defaults. base.yml is the canonical source - keep in sync.
# (YAML anchors don't cross file boundaries in compose, so each file that
# uses <<: *base-config must define its own copy of the anchor.)
x-base-config: &base-config
  restart: unless-stopped
  networks:
    - ops-network
  logging:
    driver: json-file
    options:
      max-size: "200m"
      max-file: "10"

services:
  litellm:
    <<: *base-config
    image: docker.litellm.ai/berriai/litellm:main-stable
    container_name: litellm
    env_file:
      - ./deploy/.env
    environment:
      # --- Postgres (compose service DNS) ---
      DATABASE_URL: postgresql://${POSTGRES_USERNAME:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${LITELLM_DB_NAME:-litellm}
      # Allows adding / managing models via the UI.
      STORE_MODEL_IN_DB: "True"
      # --- Redis (compose service DNS, from middleware.yml) ---
      # Uncomment to enable response caching and distributed router state.
      # REDIS_HOST: redis
      # REDIS_PORT: "6379"
      # REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    #########################################
    ## Uncomment to start proxy with a config.yaml file ##
    # volumes:
    #   - ./deploy/config.yaml:/app/config.yaml
    # command: ["--config", "/app/config.yaml"]
    ##############################################
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
