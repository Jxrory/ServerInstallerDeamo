# WebSocket upgrade map - must be loaded ONCE in http context.
# Included via /etc/nginx/conf.d/websocket.conf (see config_nginx.sh).
# Do NOT re-declare `map $http_upgrade $connection_upgrade` in individual
# site configs or nginx -t will fail with "duplicate map".

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
