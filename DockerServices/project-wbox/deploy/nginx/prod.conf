# ============================================
# WonderBoxV2 - Production nginx config
# ============================================
# Mounted by docker-compose.prod.yml at /etc/nginx/conf.d/default.conf.
# Proxies /api/v1/app -> app:8080, /api/v1/admin -> admin:8081, and
# serves the prebuilt frontend SPAs from bind-mounted dist folders.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # --- User-facing frontend (prebuilt Vite dist) ---
    root /usr/share/nginx/html/web;
    index index.html;

    # SPA fallback for the user app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1h;
    }

    # --- Admin frontend (prebuilt dist under /admin) ---
    # Serve the admin SPA at /admin/* and fall back to its index.html.
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # --- User-facing API -> app container (port 8080) ---
    location /api/v1/app/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Admin API -> admin container (port 8081) ---
    location /api/v1/admin/ {
        proxy_pass http://admin:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- OAuth2 + login (app backend) ---
    location /oauth2/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
