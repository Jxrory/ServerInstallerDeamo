name: jxrory

# Shared defaults merged into every service via `<<: *base-config`.
# Defined under x-base-config so compose treats it as an extension field
# (top-level keys in compose are a closed set: services/networks/volumes/...).
x-base-config: &base-config
  restart: unless-stopped
  networks:
    - ops-network
  logging:
    driver: json-file
    options:
      max-size: "200m"
      max-file: "10"

networks:
  ops-network:
    name: ops-network
    driver: bridge
