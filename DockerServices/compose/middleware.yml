# Shared service defaults. base.yml is the canonical source - keep in sync.
# (YAML anchors don't cross file boundaries in compose, so each file that
# uses <<: *base-config must define its own copy of the anchor.)
x-base-config: &base-config
  restart: unless-stopped
  networks:
    - ops-network
  logging:
    driver: json-file
    options:
      max-size: "200m"
      max-file: "10"

services:
  redis:
    <<: *base-config
    image: redis:7-alpine
    container_name: redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data/redis
    env_file:
      - ../env/redis.env
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    healthcheck:
      # redis-cli -a needs the password to actually authenticate; without it
      # PING returns NOAUTH on a requirepass-protected server and the check
      # would never go healthy.
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    <<: *base-config
    image: pgvector/pgvector:pg16
    container_name: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ../env/postgres.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
