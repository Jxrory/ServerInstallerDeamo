route:
  receiver: "feishu-bot"
  group_by: ["alertname", "container"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: "feishu-bot"
    webhook_configs:
      # 飞书机器人开启签名校验，Alertmanager 无法动态签名，经 webhook-feishu 适配器加签转发。
      - url: "http://webhook-feishu:9100/alert"
        send_resolved: true
